name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # cmdline-tools-version must match the version already on the runner (12.0).
      # Without it the action decides the preinstalled tools are the "wrong version",
      # downloads newer ones, and then asks to accept 6 SDK licences one by one.
      # Nobody is there to answer, so the build stops and waits until it fails.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12.0"
          accept-android-sdk-licenses: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hadiqati-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Keeps a ready-to-install APK sitting on the repo's Releases page at all times,
      # instead of only inside an Actions artifact (which expires and needs a GitHub login).
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" hadiqati.apk

          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          SIZE=$(du -h hadiqati.apk | cut -f1)

          {
            printf 'Debug build, %s — commit `%s`, built %s\n\n' "$SIZE" "$SHORT_SHA" "$BUILT"
            printf 'Replaced automatically on every push to the default branch.\n'
          } > release-notes.md

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Hadiqati (latest build)" --notes-file release-notes.md
          else
            gh release create latest --title "Hadiqati (latest build)" --notes-file release-notes.md
          fi

          gh release upload latest hadiqati.apk --clobber
